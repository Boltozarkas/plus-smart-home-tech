server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/order_db
    username: dbuser
    password: "12345"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: BASIC
          inventory-service:
            connectTimeout: 3000
            readTimeout: 3000
            loggerLevel: BASIC
          product-service:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: BASIC

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    ru.yandex.practicum.order.client.ProductClient: DEBUG
    ru.yandex.practicum.order.client.InventoryClient: DEBUG
    ru.yandex.practicum.order.client.ProductClientFallbackFactory: DEBUG
    ru.yandex.practicum.order.client.InventoryClientFallbackFactory: DEBUG