spring:
  application:
    name: api-gateway
  config:
    import: ""
  cloud:
    config:
      enabled: false
    gateway:
      # CORS-конфигурация для тестов (такая же, как во внешнем конфиге)
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:8443
              - http://localhost:3000
              - http://localhost:5173
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - Location
            allow-credentials: true
            max-age: 3600
      # Маршруты для тестов (чтобы OPTIONS /api/orders находил маршрут)
      routes:
        - id: order-service-read
          uri: http://localhost:9999
          predicates:
            - Path=/api/orders/**
            - Method=GET
        - id: order-service
          uri: http://localhost:9999
          predicates:
            - Path=/api/orders/**
        - id: product-service-products
          uri: http://localhost:9999
          predicates:
            - Path=/api/products/**
        - id: product-service-categories
          uri: http://localhost:9999
          predicates:
            - Path=/api/categories/**
        - id: inventory-service
          uri: http://localhost:9999
          predicates:
            - Path=/api/inventory/**

eureka:
  client:
    enabled: false

app:
  security:
    users:
      - username: ivan
        password: ivan
        roles:
          - USER
      - username: anna
        password: anna
        roles:
          - USER
          - ADMIN